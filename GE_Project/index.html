<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Automatic Work Table - User authentication and scheduling system"
    />
    <meta name="theme-color" content="#031b69" />
    <title>Login - Automatic Work Table</title>
    <link rel="preload" as="style" href="style.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="preload" as="style" href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" />
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
    <script src="i18n.js"></script>
  </head>

  <body>
    <div class="wrapper">
      <form action="" onsubmit="handleSubmit(event)">
        <!-- Back navigation -->
        <div class="back-btn-container">
          <button
            type="button"
            onclick="goBackToMain()"
            class="back-btn"
            aria-label="Go back to main page"
          >
            <i class="bx bx-arrow-back" aria-hidden="true"></i> Back to Main
          </button>
        </div>

        <h1 id="formTitle">Login</h1>

        <div class="input-box">
          <input id="username" type="text" placeholder="Username" required aria-label="Username" />
          <i class="bx bxs-user" aria-hidden="true"></i>
        </div>

        <div class="input-box">
          <input
            id="password"
            type="password"
            placeholder="Password (8+ characters)"
            required
            aria-label="Password"
          />
          <i class="bx bxs-lock-alt" aria-hidden="true"></i>
          <button
            type="button"
            class="password-toggle"
            onclick="togglePassword('password', this)"
            aria-label="Show password"
          >
            Show
          </button>
        </div>

        <div id="registerFields" hidden>
          <div class="input-box">
            <input id="fullName" type="text" placeholder="Full name" aria-label="Full name" />
          </div>
          <div class="input-box">
            <input
              id="studentId"
              type="text"
              placeholder="Student ID (optional)"
              aria-label="Student ID"
            />
          </div>
          <div class="input-box">
            <input id="major" type="text" placeholder="Major (optional)" aria-label="Major" />
          </div>
          <div class="input-box">
            <input
              id="passwordConfirmation"
              type="password"
              placeholder="Confirm password"
              aria-label="Confirm password"
            />
            <i class="bx bxs-lock-alt" aria-hidden="true"></i>
            <button
              type="button"
              class="password-toggle"
              onclick="togglePassword('passwordConfirmation', this)"
              aria-label="Show password confirmation"
            >
              Show
            </button>
          </div>
        </div>

        <div id="loginOptions" class="remember-forgot">
          <label><input type="checkbox" aria-label="Remember me" />Remember me</label>
          <a href="#" aria-label="Password recovery">Forget password?</a>
        </div>

        <p id="message" role="alert" aria-live="polite"></p>

        <button id="submitButton" type="submit" class="btn">Login</button>

        <div class="register-link">
          <p id="switchText">
            Don't have an account?
            <a href="#" onclick="toggleMode(event)" aria-label="Switch to registration form"
              >Register</a
            >
          </p>
        </div>
      </form>
    </div>

    <script>
      'use strict';

      function goBackToMain() {
        if (document.referrer && document.referrer.includes('projectV3TEST.html')) {
          window.history.back();
        } else {
          window.location.href = 'projectV3TEST.html';
        }
      }

      let registerMode = false;

      async function readApiResponse(response) {
        const responseText = await response.text();
        let result;
        try {
          result = responseText ? JSON.parse(responseText) : {};
        } catch (error) {
          throw new Error(
            response.ok
              ? appTranslate('The server returned an invalid response.')
              : `The server rejected the request (${response.status}): ${responseText.slice(
                  0,
                  100
                )}`
          );
        }
        if (!response.ok) {
          throw new Error(result.error || `Request failed (${response.status})`);
        }
        return result;
      }

      function showLoginMode() {
        registerMode = false;
        document.getElementById('formTitle').textContent = appTranslate('Login');
        document.getElementById('submitButton').textContent = appTranslate('Login');
        document.getElementById('registerFields').hidden = true;
        document.getElementById('loginOptions').hidden = false;
        document.getElementById('password').placeholder = appTranslate('Password');
        document.getElementById('fullName').required = false;
        document.getElementById('passwordConfirmation').required = false;
        document.getElementById('switchText').innerHTML =
          `${appTranslate("Don't have an account?")} <a href="#" onclick="toggleMode(event)" aria-label="${appTranslate('Switch to registration form')}">${appTranslate('Register')}</a>`;
      }

      function toggleMode(event) {
        event.preventDefault();
        registerMode = !registerMode;
        document.getElementById('formTitle').textContent = registerMode
          ? appTranslate('Register')
          : appTranslate('Login');
        document.getElementById('submitButton').textContent = registerMode
          ? appTranslate('Create account')
          : appTranslate('Login');
        document.getElementById('registerFields').hidden = !registerMode;
        document.getElementById('loginOptions').hidden = registerMode;
        document.getElementById('password').placeholder = registerMode
          ? appTranslate('Password (8+ characters)')
          : appTranslate('Password');
        document.getElementById('fullName').required = registerMode;
        document.getElementById('passwordConfirmation').required = registerMode;
        document.getElementById('switchText').innerHTML = registerMode
          ? `${appTranslate('Already have an account?')} <a href="#" onclick="toggleMode(event)" aria-label="${appTranslate('Switch to login form')}">${appTranslate('Login')}</a>`
          : `${appTranslate("Don't have an account?")} <a href="#" onclick="toggleMode(event)" aria-label="${appTranslate('Switch to registration form')}">${appTranslate('Register')}</a>`;
      }

      async function handleSubmit(event) {
        event.preventDefault();
        const message = document.getElementById('message');
        message.textContent = '';
        const payload = {
          username: document.getElementById('username').value,
          password: document.getElementById('password').value,
        };
        const endpoint = registerMode ? '/api/register' : '/api/login';
        if (registerMode) {
          payload.fullName = document.getElementById('fullName').value;
          payload.studentId = document.getElementById('studentId').value;
          payload.major = document.getElementById('major').value;
          payload.passwordConfirmation = document.getElementById('passwordConfirmation').value;
        }
        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });
          await readApiResponse(response);
          if (registerMode) {
            showLoginMode();
            document.getElementById('password').value = '';
            document.getElementById('passwordConfirmation').value = '';
            message.textContent = appTranslate('Registration successful. Please log in.');
            document.getElementById('username').focus();
          } else {
            window.location.href = 'projectV3TEST.html';
          }
        } catch (error) {
          message.textContent = appTranslate(error.message);
        }
      }

      function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);
        const isVisible = input.type === 'text';
        input.type = isVisible ? 'password' : 'text';
        button.textContent = isVisible ? 'Show' : 'Hide';
        button.setAttribute('aria-label', isVisible ? 'Show password' : 'Hide password');
      }

      async function redirectAuthenticatedUser() {
        try {
          const response = await fetch('/api/me', {
            method: 'GET',
            credentials: 'same-origin',
            headers: { Accept: 'application/json' },
          });
          if (response.ok) {
            window.location.replace('projectV3TEST.html');
          }
        } catch (error) {
          // Keep the login form available when the API is unavailable.
          console.warn('Unable to verify the current session.', error);
        }
      }

      redirectAuthenticatedUser();
      if (window.initAppLanguage) {
        window.initAppLanguage();
      }
    </script>
  </body>
</html>
